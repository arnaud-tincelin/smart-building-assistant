[project]
name = "buildingassist-backend"
version = "0.1.0"
description = "BuildingAssist demo backend — FastAPI service that calls an Azure AI Foundry agent."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "azure-ai-projects>=2.3,<3",
    "openai>=2.46,<3",
    "azure-identity>=1.19.0",
    "azure-search-documents>=12,<13",
    "azure-monitor-opentelemetry>=1.8.9,<2",
    "azure-core-tracing-opentelemetry>=1.0.0b13,<2",
    "opentelemetry-api>=1.30,<2",
    "httpx>=0.28,<1",
    "mcp>=1.20,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "opentelemetry-sdk>=1.30,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "cfs"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
