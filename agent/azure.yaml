# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: buildingassist-agent
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-4.1-mini
                version: "2025-04-14"
              name: gpt-4.1-mini
              sku:
                capacity: 30
                name: GlobalStandard
    buildingassist-agent:
        project: src/buildingassist-agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Contoso Energy smart-building assistant. Answers energy questions grounded on Foundry IQ knowledge.
        displayName: BuildingAssist
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: BUILDINGASSIST_KNOWLEDGE_NAME
              value: buildingassist-knowledge
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Responses Protocol
                - BuildingAssist
                - Python
        name: buildingassist-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
